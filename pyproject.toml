[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[project]
name = "snakemake-executor-plugin-aws-batch-flex"
version = "0.2.1"
description = "Snakemake executor plugin for AWS Batch that runs each rule in an off-the-shelf container image, such as a biocontainer, with no Snakemake inside"
dynamic = ["readme"]
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Stephen Smith" }]
keywords = ["snakemake", "aws", "aws-batch", "executor", "plugin", "bioinformatics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "snakemake-interface-common>=1.17.4,<2",
    "snakemake-interface-executor-plugins>=9.3.2,<10",
    "snakemake-interface-storage-plugins>=4.0.0,<5",
    "boto3>=1.34",
    "pyyaml",
]

[project.urls]
Homepage = "https://github.com/SSmith-NUIG/snakemake-executor-plugin-aws-batch-flex"
Repository = "https://github.com/SSmith-NUIG/snakemake-executor-plugin-aws-batch-flex"
Documentation = "https://github.com/SSmith-NUIG/snakemake-executor-plugin-aws-batch-flex#getting-started"
Issues = "https://github.com/SSmith-NUIG/snakemake-executor-plugin-aws-batch-flex/issues"
Changelog = "https://github.com/SSmith-NUIG/snakemake-executor-plugin-aws-batch-flex/blob/main/CHANGELOG.md"

[project.scripts]
snakemake-batch-flex-host-env = "snakemake_executor_plugin_aws_batch_flex.hostenv:main"
smkflex = "snakemake_executor_plugin_aws_batch_flex.remote:main"

[project.optional-dependencies]
test = ["pytest", "pytest-xdist", "ruff", "snakemake", "snakemake-storage-plugin-fs", "snakemake-storage-plugin-s3",
        "pandas"]  # scripts handed pandas params (test_script_python)

# PyPI gives headings no anchors: links within the README go to it on GitHub instead
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\(#'
replacement = '](https://github.com/SSmith-NUIG/snakemake-executor-plugin-aws-batch-flex#'

# and the other pages of the documentation
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\(docs/'
replacement = '](https://github.com/SSmith-NUIG/snakemake-executor-plugin-aws-batch-flex/blob/main/docs/'

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# syntax errors, pyflakes (undefined and unused names) and bugbear (likely bugs)
select = ["E9", "F", "B"]

[tool.hatch.build.targets.wheel]
packages = ["src/snakemake_executor_plugin_aws_batch_flex"]
